<!DOCTYPE html>
<html>
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="g_id_onload"
    data-client_id="41470247047-8pp4g0s953m7ojmfkgvrdcpd5erjnht3.apps.googleusercontent.com"
    data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    function handleCredentialResponse(response) {
      console.log("Your token:");
      console.log(response.credential); // Copy this
      document.getElementById("token").innerText = response.credential;
    }
  </script>

  <p id="token" style="word-break:break-all"></p>
</body>
</html>
